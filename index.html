<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, World!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #0b1020;
        color: #f8fbff;
        font-family: Manrope, system-ui, sans-serif;
      }
      .orb {
        position: fixed;
        width: 34rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(12px);
        opacity: .45;
        animation: float 12s ease-in-out infinite alternate;
      }
      .orb.one { top: -15rem; left: -10rem; background: #5b5bf7; }
      .orb.two { right: -13rem; bottom: -14rem; background: #00c6a7; animation-delay: -4s; }
      main {
        width: min(92%, 760px);
        position: relative;
        padding: clamp(2rem, 7vw, 5rem);
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
        box-shadow: 0 30px 90px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.2);
        backdrop-filter: blur(18px);
      }
      nav { display: flex; justify-content: flex-end; gap: 1.2rem; margin-bottom: clamp(2rem, 5vw, 4rem); }
      nav a { color: #d7def1; font-size: .88rem; font-weight: 700; text-decoration: none; }
      nav a:hover { color: #a9ffe9; }
      .eyebrow {
        margin: 0 0 1.25rem;
        font: 500 .78rem/1 "DM Mono", monospace;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #a9ffe9;
      }
      h1 {
        margin: 0;
        font-size: clamp(3.2rem, 12vw, 7.4rem);
        line-height: .95;
        letter-spacing: -.075em;
      }
      h1 span {
        display: block;
        background: linear-gradient(100deg, #fff 8%, #bfc5ff 45%, #75f7d5 92%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .message {
        max-width: 34rem;
        margin: 1.7rem 0 2.3rem;
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.75;
        color: #d7def1;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: .95rem 1.35rem;
        color: #08101d;
        background: #a9ffe9;
        font: 700 .9rem/1 Manrope, sans-serif;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(112, 247, 213, .28);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      button:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(112, 247, 213, .38); }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
      .sparkle { display: inline-block; margin-right: .4rem; }
      @keyframes float { to { transform: translate(4rem, 3rem) scale(1.12); } }
      @media (prefers-reduced-motion: reduce) { .orb { animation: none; } button { transition: none; } }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <main>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
      <p class="eyebrow">A bright beginning</p>
      <h1>Hello,<span>World!</span></h1>
      <p class="message">Your corner of the internet is ready. Start small, stay curious, and make something wonderful.</p>
      <button id="greetingButton"><span class="sparkle">✦</span>Say hello back</button>
    </main>
    <script>
      const button = document.querySelector('#greetingButton');
      button.addEventListener('click', () => {
        button.innerHTML = '<span class="sparkle">✦</span>Nice to meet you!';
      });
    </script>
  </body>
</html>
